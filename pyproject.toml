[project]
name = "fin-music-app"
version = "0.1.0"
description = "A music recommendation app built with Streamlit."
dependencies = [
    "streamlit",
    "spotipy",
    "musicbrainzngs",
]
requires-python = ">=3.8"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
